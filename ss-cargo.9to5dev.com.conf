# /etc/nginx/sites-available/ss-cargo.9to5dev.com
#
#   sudo cp ss-cargo.9to5dev.com.conf /etc/nginx/sites-available/ss-cargo.9to5dev.com
#   sudo ln -s /etc/nginx/sites-available/ss-cargo.9to5dev.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d ss-cargo.9to5dev.com
#
# Port 80 only — certbot adds the 443 block and the redirect.

server {
    listen 80;
    listen [::]:80;
    server_name ss-cargo.9to5dev.com;

    root /var/www/ss-cargo;
    index index.php;

    access_log /var/log/nginx/ss-cargo.9to5dev.com.access.log;
    error_log  /var/log/nginx/ss-cargo.9to5dev.com.error.log;

    client_max_body_size 16M;

    # --- Security ---
    # Keep these ABOVE the \.php$ block. nginx stops at the first matching
    # regex location, so if PHP came first, includes/config.php would be
    # executed and database/seed.sql served as plain text.

    location ~ ^/(includes|database|partials)/ { deny all; }
    location ~* \.(sql|bak|md|log|ini|txt)$    { deny all; }
    location ~ /\.(?!well-known)               { deny all; }
    location = /install.php                    { deny all; }

    # --- App ---

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # index.php fingerprints CSS/JS with ?v=<mtime>, so a long cache is safe.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { log_not_found off; access_log off; allow all; }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json;
}
